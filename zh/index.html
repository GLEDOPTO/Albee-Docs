<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Albee 文档中心</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Albee 桌面机器人使用文档：激活、灯光、闹钟、舵机校准、固件与协议">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">
  <style>
    .markdown-section { max-width: 900px; }
    .app-nav li a:hover { color: #42b983; }
  </style>
</head>
<body>
  <nav class="app-nav no-badge">
    <a href="../">English</a>
    <a href="./">中文</a>
  </nav>

  <div id="app">文档加载中…</div>

  <script>
    // Docsify 只在路由为 /README.md 时应用 homepage；直接访问目录入口时 hash 为空，
    // 会拼出 ".md" 导致 404。这里确保入口始终带 "#/"。
    (function () {
      if (location.hash.indexOf('#/') !== 0) {
        location.replace(location.pathname + location.search + '#/');
      }
    })();
  </script>

  <script>
    (function () {
      var root = location.pathname.replace(/index\.html$/, '').replace(/zh\/?$/, '');
      if (root.charAt(root.length - 1) !== '/') { root += '/'; }

      window.$docsify = {
        basePath: root,
        name: 'Albee Docs',
        repo: 'https://github.com/GLEDOPTO/Albee-Docs',
        homepage: '中文版本/Albee百科全书.md',
        loadSidebar: 'zh/_sidebar.md',
        subMaxLevel: 2,
        auto2top: true,
        relativePath: false,
        docDir: '中文版本/docs/',
        indexPath: '中文版本/Albee百科全书',
        maxLevel: 4,
        plugins: [
          function (hook, vm) {
            hook.afterEach(function (html) {
              var docDir = vm.config.docDir || '';
              var indexPath = vm.config.indexPath || '';
              var root = vm.config.basePath || '/';

              // 1) 修正 Docsify 已转成 hash 的文档链接（如 #/./docs/device-activation）
              html = html.replace(/href="#\/([^"]+)"/g, function (m, p) {
                var anchor = '';
                var i = p.indexOf('#');
                if (i > -1) { anchor = p.slice(i); p = p.slice(0, i); }
                var clean = p.replace(/^\.\//, '').replace(/^\.\.\//, '');
                if (clean === '' || clean === '/') { return 'href="#/' + (indexPath || docDir) + anchor + '"'; }
                if (clean.indexOf(docDir) === 0) { return 'href="#/' + clean + anchor + '"'; }
                if (indexPath && clean.indexOf(indexPath) === 0) { return 'href="#/' + indexPath + anchor + '"'; }
                var file = clean.split('/').pop();
                if (/^readme$/i.test(file)) { return 'href="#/' + (indexPath || docDir) + anchor + '"'; }
                return 'href="#/' + docDir + file + anchor + '"';
              });

              // 2) 未转换的相对 .md 链接（兜底）
              html = html.replace(
                /href="(?!https?:)(?!#)(?!\/)([^"]+\.md)(#[^"]*)?"/g,
                function (m, p, hash) {
                  var file = p.split('/').pop().replace(/\.md$/, '');
                  return 'href="#/' + docDir + file + (hash || '') + '"';
                }
              );

              // 3) 图片：../../assets/... 与 /assets/... -> 站点根 assets
              html = html.replace(/src="(?:\.\.\/)+assets\//g, 'src="' + root + 'assets/');
              html = html.replace(/src="\/assets\//g, 'src="' + root + 'assets/');
              return html;
            });
          }
        ],
        search: {
          paths: 'auto',
          depth: 3,
          placeholder: '搜索文档',
          noData: '没有找到结果'
        },
        formatUpdated: '{YYYY}-{MM}-{DD}'
      };
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
